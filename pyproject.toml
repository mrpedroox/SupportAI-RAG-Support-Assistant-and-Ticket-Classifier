[project]
name = "supportai"
version = "0.1.0"
description = "A source-grounded support assistant and supervised ticket classifier."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
required-version = "==0.13.6"
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
